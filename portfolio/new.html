<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, initial-scale=1.0">
    <title>John Doe - 3D Web Developer</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            color: #fff;
        }
        #scene-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.7);
            padding: 10px;
            border-radius: 5px;
        }
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        #loading-text {
            font-size: 2em;
            color: #fff;
        }
    </style>
</head>
<body>
    <div id="loading" role="alert" aria-live="assertive">
        <div id="loading-text">Loading...</div>
    </div>
    <div id="scene-container" role="main"></div>
    <div id="info" role="region" aria-labelledby="info-heading">
        <h1 id="info-heading">John Doe</h1>
        <p>3D Web Developer</p>
        <p>Click on planets to explore!</p>
    </div>

    <script type="module">
        import * as THREE from 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.module.js';
        import { OrbitControls } from 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/jsm/controls/OrbitControls.js';
        import { GLTFLoader } from 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/jsm/loaders/GLTFLoader.js';

        let scene, camera, renderer, controls;
        let planets = [];

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 50;

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('scene-container').appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);

            const pointLight = new THREE.PointLight(0xffffff, 1);
            pointLight.position.set(10, 10, 10);
            scene.add(pointLight);

            createSpace();
            createPlanets();

            window.addEventListener('resize', onWindowResize, false);

            animate();

            // Hide loading screen
            document.getElementById('loading').style.display = 'none';
        }

        function createSpace() {
            const loader = new THREE.TextureLoader();
            loader.load(
                'https://i.imgur.com/xM62r62.jpeg',
                function (texture) {
                    const geometry = new THREE.SphereGeometry(500, 60, 40);
                    geometry.scale(-1, 1, 1);
                    const material = new THREE.MeshBasicMaterial({ map: texture });
                    const spaceSphere = new THREE.Mesh(geometry, material);
                    scene.add(spaceSphere);
                },
                undefined,
                function (err) {
                    console.error('An error happened while loading the texture.', err);
                }
            );
        }

        function createPlanets() {
            const planetData = [
                { name: 'About', color: 0x3366cc, size: 4, orbit: 20 },
                { name: 'Skills', color: 0x33cc33, size: 3, orbit: 30 },
                { name: 'Projects', color: 0xcc3333, size: 5, orbit: 40 },
                { name: 'Contact', color: 0xcccc33, size: 2, orbit: 50 }
            ];

            planetData.forEach((data, index) => {
                const geometry = new THREE.SphereGeometry(data.size, 32, 32);
                const material = new THREE.MeshStandardMaterial({ color: data.color });
                const planet = new THREE.Mesh(geometry, material);

                const angle = (index / planetData.length) * Math.PI * 2;
                planet.position.x = Math.cos(angle) * data.orbit;
                planet.position.z = Math.sin(angle) * data.orbit;

                scene.add(planet);
                planets.push({ mesh: planet, name: data.name, orbit: data.orbit });
            });
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            planets.forEach((planet, index) => {
                const time = Date.now() * 0.001;
                const angle = time * 0.2 + index * (Math.PI / 2);
                planet.mesh.position.x = Math.cos(angle) * planet.orbit;
                planet.mesh.position.z = Math.sin(angle) * planet.orbit;
                planet.mesh.rotation.y += 0.01;
            });

            controls.update();
            renderer.render(scene, camera);
        }

        function onClick(event) {
            const raycaster = new THREE.Raycaster();
            const mouse = new THREE.Vector2();

            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);

            const intersects = raycaster.intersectObjects(scene.children);

            for (let intersect of intersects) {
                const clickedPlanet = planets.find(planet => planet.mesh === intersect.object);
                if (clickedPlanet) {
                    alert(`You clicked on ${clickedPlanet.name}! Here you can add more detailed information or navigation.`);
                    break;
                }
            }
        }

        window.addEventListener('click', onClick);

        init();
    </script>
</body>
</html>
